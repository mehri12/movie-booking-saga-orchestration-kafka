apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saga
  namespace: argocd
spec:
  project: default

  # D'où vient la configuration : le chart Helm de ton dépôt, branche main.
  source:
    repoURL: https://github.com/mehri12/movie-booking-saga-orchestration-kafka.git
    targetRevision: main
    path: helm/movie-booking
    helm:
      releaseName: saga

  # Où l'appliquer : le cluster dans lequel Argo CD tourne, namespace saga.
  destination:
    server: https://kubernetes.default.svc
    namespace: saga

  syncPolicy:
    automated:
      # prune : supprimer du cluster ce qui a disparu de Git.
      prune: true
      # selfHeal : annuler toute modification faite à la main dans le cluster.
      selfHeal: true