kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Marque le nœud pour que le contrôleur Ingress NGINX s'y installe.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Relie le port 80 de la machine (le runner) au port 80 du nœud :
    # c'est ce qui remplace « minikube tunnel » dans la CI.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP