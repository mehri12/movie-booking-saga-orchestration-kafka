name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - booking-service
          - seat-inventory-service
          - payment-service
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Installer le module commun
        run: mvn -B -f movie-booking-commons/pom.xml clean install -DskipTests

      - name: Compiler ${{ matrix.service }}
        run: mvn -B -f ${{ matrix.service }}/pom.xml clean verify -Dtest='*ServiceTest' -Dsurefire.failIfNoSpecifiedTests=false

  build-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler l'orchestrateur
        run: mvn -B -f orchestrator-service/pom.xml clean verify

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Construire l'application
        run: npm run build      

  docker-images:
    needs: [ build-services, build-orchestrator, build-frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: booking-service
            context: .
            dockerfile: booking-service/Dockerfile
          - name: seat-service
            context: .
            dockerfile: seat-inventory-service/Dockerfile
          - name: payment-service
            context: .
            dockerfile: payment-service/Dockerfile
          - name: orchestrator-service
            context: ./orchestrator-service
            dockerfile: orchestrator-service/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile  
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  e2e:
    needs: [ build-services, build-orchestrator ]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Créer le fichier .env de test
        run: |
          {
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=')"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=')"
          } > .env  

      - name: Démarrer tout le système
        run: docker compose up -d --build

      - name: Scénarios de bout en bout
        run: bash scripts/e2e.sh

      - name: Afficher les logs en cas d'échec
        if: failure()
        run: docker compose logs --tail=200

      - name: Arrêter le système
        if: always()
        run: docker compose down -v

  e2e-kubernetes:
    needs: [ docker-images ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Créer un cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: saga
          config: .github/kind-config.yaml

      - name: Installer l'Ingress NGINX
        run: |
          kubectl apply -f https://kind.sigs.k8s.io/examples/ingress/deploy-ingress-nginx.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=180s

      - name: Installer MySQL et Kafka
        run: bash scripts/k8s-ci-setup.sh

      - name: Installer l'application avec Helm
        run: helm install saga helm/movie-booking --namespace saga --set-string image.tag=${{ github.sha }} --wait --timeout 10m

      - name: Scénarios de bout en bout sur Kubernetes
        run: bash scripts/e2e-k8s.sh

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          kubectl get pods -n saga
          kubectl describe pods -n saga | tail -120
          kubectl logs -n saga -l app --all-containers --prefix --tail=40