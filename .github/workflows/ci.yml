name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - booking-service
          - seat-inventory-service
          - payment-service
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Installer le module commun
        run: mvn -B -f movie-booking-commons/pom.xml clean install -DskipTests

      - name: Compiler ${{ matrix.service }}
        run: mvn -B -f ${{ matrix.service }}/pom.xml clean package -DskipTests

  build-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler l'orchestrateur
        run: mvn -B -f orchestrator-service/pom.xml clean package -DskipTests

  docker-images:
    needs: [ build-services, build-orchestrator ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: booking-service
            context: .
            dockerfile: booking-service/Dockerfile
          - name: seat-service
            context: .
            dockerfile: seat-inventory-service/Dockerfile
          - name: payment-service
            context: .
            dockerfile: payment-service/Dockerfile
          - name: orchestrator-service
            context: ./orchestrator-service
            dockerfile: orchestrator-service/Dockerfile
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}