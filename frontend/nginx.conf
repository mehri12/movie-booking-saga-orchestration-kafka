server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Route de santé, utilisée plus tard par les probes Kubernetes.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Les fichiers JavaScript et CSS générés par Angular ont une empreinte
  # dans leur nom : on peut les garder en cache un an.
  location ~* \.(?:js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # La page elle-même ne doit jamais être gardée en cache, pour que
  # chaque déploiement soit visible tout de suite.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}