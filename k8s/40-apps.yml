apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-service
  namespace: saga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator-service
  template:
    metadata:
      labels:
        app: orchestrator-service
    spec:
      containers:
        - name: orchestrator-service
          image: ghcr.io/mehri12/orchestrator-service:latest
          ports:
            - containerPort: 9494
          envFrom:
            - configMapRef:
                name: kafka-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
          readinessProbe:
            tcpSocket:
              port: 9494
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 20
---
