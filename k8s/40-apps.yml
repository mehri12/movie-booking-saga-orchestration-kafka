apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-service
  namespace: saga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator-service
  template:
    metadata:
      labels:
        app: orchestrator-service
    spec:
      containers:
        - name: orchestrator-service
          image: ghcr.io/mehri12/orchestrator-service:latest
          ports:
            - containerPort: 9494
          envFrom:
            - configMapRef:
                name: kafka-config
          env:
            # Active les groupes /actuator/health/liveness et /readiness
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            # La JVM utilise au plus 70% de la limite mémoire du conteneur
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70"
          resources:
            requests:
              memory: "256Mi"   # réservé au scheduling
              cpu: "100m"
            limits:
              memory: "640Mi"   # au-delà : OOMKilled
              cpu: "500m"
          # 1) Startup : laisse le temps de démarrer (36 x 5s = 180s max)
          #    Tant qu'elle n'a pas réussi, liveness et readiness sont suspendues.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9494
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          # 2) Readiness : le pod peut-il recevoir du trafic ? Sinon retiré du Service.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9494
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 3) Liveness : le pod est-il bloqué ? Sinon redémarré.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9494
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
