apiVersion: apps/v1
kind: Deployment
metadata:
  name: seat-service
  namespace: saga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seat-service
  template:
    metadata:
      labels:
        app: seat-service
    spec:
      containers:
        - name: seat-service
          image: ghcr.io/mehri12/seat-service:latest
          ports:
            - containerPort: 9292
          envFrom:
            - configMapRef:
                name: kafka-config
            - configMapRef:
                name: db-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
          readinessProbe:
            tcpSocket:
              port: 9292
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 20
---
